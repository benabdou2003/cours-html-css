<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie d'images</title>
</head>
<body>
    
    <h4>Exercice 1</h4>

    <h1>Ma galerie d'images</h1>
    <!-- Image 1 : paysage avec dimensions -->
    <h2>Un paysage</h2>
    <img src="images/paysage.jfif" alt="Vue paranomique d'un paysage tropical au coucher du soleil" width="600" title="Paysage tropical">
    <p>Photo de paysage - largeur fixée à 600 px.</p>

    <!-- Image 2 : logo PNG transparent -->
    <h2>Un logo PNG</h2>
    <img src="images/logo.jfif" alt="Logo de l'application web" width="150" height="150" >
    <p>Logo PNG fond transparent.</p>

    <!-- image 3 : portrait en tant que lien-->
     <h2>Portrait cliquable</h2>
     <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">
        <img src="images/portrait.jfif" alt="Portrait - cliquez pour aller sur Google" width="200">
     </a>
     <p>cliquez sur la photo pour accéder à Google</p>

     <!-- Image 4 : lien brisé internationnal (tester alt) -->
      <h2>Image manquante (tester alt)</h2>
      <img src="images/inexistante.jpg" alt="cette image n'existe pas - le texte alt s'affiche à sa place" width="300">
      
</body>
</html>
