<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue de produits</title>
</head>
<body>
    <h4>Exercice 6</h4>
    <h1>Notre catalogue</h1>

    <table border="1" style="width: 100%, height: 50" cellspacing="0" cellpadding="6">
        <caption><b>Catalogue des accessoires informatiques</b></caption>
        <thead>
            <tr bgcolor="000000">
                <th scope="col"> <font color="#FFFFFF">Souris sans fil</th>
                <th scope="col"><font color="#FFFFFF">Clavier mécanique</th>
                <th scope="col"><font color="#FFFFFF">Webcam HD</th>
            </tr>
        </thead>
        <tbody>
            <!-- Ligne image-->
            <tr>
                <td>
                    <img src="images/souris.jfif" alt="Souris sana fil noir" width="150">
                </td>
                <td>
                    <img src="images/clavier.jfif" alt="lavier mécanique rétroéclairé" width="150">
                </td>
                <td>
                    <img src="images/webcam.jfif" alt="Webcam HD grand angle" width="150">
                </td>
            </tr>
            <!-- Ligne description-->
             <tr>
                <td>Souris ergonomique, autonome 12 mois, portée 10 m.</td>
                <td>Switches Cherry Mx Blue, rétroéclairé RGB.</td>
                <td>Résolution 1080p, micro intégré, compatible Windows/Mac.</td>
             </tr>
             <!-- Ligne prix-->
              <tr>
                <td><strong>12 000</strong></td>
                <td><strong>45 000</strong></td>
                <td><strong>22 000</strong></td>
              </tr>
        </tbody>
    </table>
</body>
</html>
