<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page de commande</title>
</head>
<body>
    <form action="#" method="post">
        
        <section>
            <h2><font color="009966">Votre commande</h2>
                <label for="produit">Produit:</label><br>
                <select name="produit" id="produit">
                    <option value="ordinateur">Ordinateur portable</option>
                    <option value="souris">Souris</option>
                    <option value="clavier">Clavier</option>
                    <option value="webcam">Webcam</option>
                    <option value="casque">Casque</option>
                </select>
                <br><br>
                <label for="quantité">Quantité:</label><br>
                <input type="number" id="quantité" name="quantité" min="1" max="10" value="1" required>
                <br><br>
                <label for="couleur">Couleur préférée du produit:</label><br>
                <input type="color" id="couleur" name="couleur" value="#000000">
                <br><br>
                <label for="date livraison">Date de livraison souhaitée</label><br>
                <input type="date" id="date livraison" name="date livraison" min="18-06-2026 + 2 jours" required>
                <br><br>
                <label for="heure livraison">Heure de livraison</label><br>
                <input type="time" id="heure livraison" name="heure livraison" min="08:00" max="18:00" step="1800">
        </section>
        <br><br>
        <section>
            <h2><font color="009966">livraison</h2>
                <legend>Mode de livraison:</legend><br>
                    <input type="radio" id="livraison" name="livraison">
                    <label for="livraison">Domicile</label><br>
                    <input type="radio" id="livraison" name="livraison">
                    <label for="livraison">Point relais</label><br>
                    <input type="radio" id="livraison" name="livraison">
                    <label for="livraison">Retrait en magasin</label>
                    <br><br>
                <label for="adresse">Adresse complète</label><br>
                <textarea name="adresse" id="adresse" required></textarea>
                <br><br>
                <label for="code postal">Code postal:</label><br>
                <input type="text" name="code postal" id="code postal" pattern="[0-9]{5}" title="5 chiffres" required>
                <br><br>
                <label for="ville">Ville:</label><br>
                <input type="text" name="ville" id="ville" list="villes">
                <datalist id="villes">
                    <option value="Dakar">
                    <option value="Thiés">
                    <option value="Touba">
                    <option value="Kaolack">
                    <option value="Ziguinchor">
                </datalist>
        </section>
        <br><br>
        <section>
            <h2><font color="009966">Paiement</h2>
                <label for="paiement">Moyen de paiement:</label><br>
                <select name="paiement" id="paiement">
                    <option value="carte bancaire">Carte bancaire</option>
                    <option value="wave">Wave</option>
                    <option value="orange money">Orange Money</option>
                    <option value="paypal">PayPal</option>
                    <option value="virement">Virement</option>
                </select>
                    <br><br>
                <label for="numéro téléphone">Numéro de téléphone mobile money</label><br>
                <input type="tel" id="numéro téléphone" name="numéro téléphone" pattern="[0-9]{9}">
                <br><br>
            <input type="checkbox" id="confirmation" name="confirmation" required>
            <label for="confirmation">Je confirme ma commande et accepte les CGV</label>
            <br><br>
            <input type="submit" value="Passer la commande">
        </section>

    </form>
</body>
</html>
