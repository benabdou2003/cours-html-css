<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de connrxion</title>
</head>
<body>
    <form method="post" action="#">
        <fieldset><legend>Connexion à votre espace</legend>
            <label for="adresse email">Adresse email:</label><br>
            <input type="text" name="adresse email" id="adresse email" required autofocus>
            <br>
            <br>
            <label for="mot de passe">Mot de passe:</label> <br>
            <input type="password" id="mot de passe" name="Mot de passe:" required minlength="8">
            <br>
            <br>
            <input type="checkbox" id="souvenir" name="souvenir">
            <label for="souvenir">Se souvenir de moi</label>
            <br>
            <br>
            <input type="submit" value="Se connecter" >
            <br>
            <br>
            <a href="#">Mot de passe oublié</a>
        </fieldset>
    </form>
</body>
</html>
